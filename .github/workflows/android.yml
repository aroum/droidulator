name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Create debug keystore
      env:
        CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
        CI_KEYSTORE_DECRYPT: ${{ secrets.CI_KEYSTORE_DECRYPT }}
      if: ${{ env.CI_KEYSTORE != '' && env.CI_KEYSTORE_DECRYPT != '' }}
      run: |
        mkdir -p ~/.android
        echo "$CI_KEYSTORE" > debug.keystore.asc
        gpg -d --passphrase "$CI_KEYSTORE_DECRYPT" --batch debug.keystore.asc > ~/.android/debug.keystore

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      run: |
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

    - name: Build APK (CI with keys if available)
      run: gradle assembleCi --stacktrace
      env:
        RELEASE_KEYSTORE_PATH: "release.jks"
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Set APK Path & Name
      run: |
        APK_FILE=$(find app/build/outputs/apk/ci/ -name "*.apk" | head -n 1)
        echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: droidulator-ci-apk
        path: ${{ env.APK_PATH }}

    - name: Set Release Tag & Title
      id: rel_info
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "tag_name=nightly" >> $GITHUB_OUTPUT
          echo "release_name=Nightly Build" >> $GITHUB_OUTPUT
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel_info.outputs.tag_name }}
        name: ${{ steps.rel_info.outputs.release_name }}
        body: |
          Droidulator Release ${{ steps.rel_info.outputs.release_name }}
          Commit: ${{ github.sha }}
        prerelease: ${{ steps.rel_info.outputs.prerelease }}
        make_latest: true
        files: ${{ env.APK_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
