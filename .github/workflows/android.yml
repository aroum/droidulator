name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Create debug keystore
      env:
        CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
        CI_KEYSTORE_DECRYPT: ${{ secrets.CI_KEYSTORE_DECRYPT }}
      if: ${{ env.CI_KEYSTORE != '' && env.CI_KEYSTORE_DECRYPT != '' }}
      run: |
        mkdir -p ~/.android
        echo "$CI_KEYSTORE" > debug.keystore.asc
        gpg -d --passphrase "$CI_KEYSTORE_DECRYPT" --batch debug.keystore.asc > ~/.android/debug.keystore

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      run: |
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

    - name: Build APK (CI with keys if available)
      run: gradle assembleCi --stacktrace
      env:
        RELEASE_KEYSTORE_PATH: "release.jks"
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Prepare Artifact & Release Names
      id: prep
      run: |
        DATE_TAG=$(date +"%y.%m.%d")
        RAW_APK=$(find app/build/outputs/apk/ci/ -name "*.apk" | head -n 1)
        
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF_NAME}"
          APK_NAME="droidulator-${VERSION}.apk"
          RELEASE_TITLE="Droidulator ${VERSION}"
          IS_PRERELEASE=false
        else
          VERSION="${DATE_TAG}-nightly"
          APK_NAME="droidulator-${DATE_TAG}-nightly.apk"
          RELEASE_TITLE="Droidulator Nightly (${DATE_TAG})"
          IS_PRERELEASE=true
        fi
        
        cp "$RAW_APK" "$APK_NAME"
        echo "apk_path=${APK_NAME}" >> $GITHUB_OUTPUT
        echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
        echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.prep.outputs.apk_name }}
        path: ${{ steps.prep.outputs.apk_path }}

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
        name: ${{ steps.prep.outputs.release_title }}
        body: |
          ${{ steps.prep.outputs.is_prerelease == 'true' && '### 🌙 Droidulator Nightly Build (Ночная сборка)' || '### Droidulator Release' }}
          
          - **Application:** Droidulator
          - **Version:** `${{ steps.prep.outputs.version }}`
          - **Commit:** `${{ github.sha }}`
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        prerelease: ${{ steps.prep.outputs.is_prerelease }}
        make_latest: ${{ steps.prep.outputs.is_prerelease == 'false' }}
        files: ${{ steps.prep.outputs.apk_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
