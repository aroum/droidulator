name: Build & Release App

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run C++ Engine Unit Tests
        run: |
          gcc -c -w -Dmain=units_main app/src/main/cpp/units_bridge.c app/src/main/cpp/gnu-units/units.c app/src/main/cpp/gnu-units/parse.tab.c app/src/main/cpp/gnu-units/strfunc.c -Iapp/src/main/cpp/gnu-units
          g++ -std=c++20 -O2 -Iapp/src/main/cpp -Iapp/src/main/cpp/engine -Iapp/src/main/cpp/tinyexpr-plusplus -Iapp/src/main/cpp/gnu-units -include app/src/main/cpp/engine/tinyexpr_compat.h -DUNITS_DAT_PATH=\"app/src/main/assets/units.dat\" app/src/main/cpp/test_jni.cpp app/src/main/cpp/tinyexpr-plusplus/tinyexpr.cpp units_bridge.o units.o parse.tab.o strfunc.o -w -o /tmp/test_jni
          /tmp/test_jni
          rm -f units_bridge.o units.o parse.tab.o strfunc.o /tmp/test_jni

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Create debug keystore
        env:
          CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
          CI_KEYSTORE_DECRYPT: ${{ secrets.CI_KEYSTORE_DECRYPT }}
        if: ${{ env.CI_KEYSTORE != '' && env.CI_KEYSTORE_DECRYPT != '' }}
        run: |
          mkdir -p ~/.android
          echo "$CI_KEYSTORE" > debug.keystore.asc
          gpg -d --passphrase "$CI_KEYSTORE_DECRYPT" --batch debug.keystore.asc > ~/.android/debug.keystore

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cp release.jks app/release.jks

      - name: Prepare build metadata and artifact names
        run: |
          BUILD_DATE=$(date -u +'%y.%m.%d')
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="${TAG_NAME}"
            ARTIFACT_NAME="droidulator-${TAG_NAME}"
            VERSION_NAME="${TAG_NAME}"
          else
            RELEASE_TITLE="${BUILD_DATE} (Nightly)"
            ARTIFACT_NAME="droidulator-${BUILD_DATE}-nightly"
            VERSION_NAME="${BUILD_DATE}"
          fi
          
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle assembleCi --stacktrace
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          RELEASE_KEYSTORE_PATH: "release.jks"
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK artifact names
        run: |
          cd app/build/outputs/apk/ci
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            UNIVERSAL_APK=$(ls *universal*.apk 2>/dev/null | head -n 1 || true)
            if [ -n "$UNIVERSAL_APK" ] && [ -f "$UNIVERSAL_APK" ]; then
              cp -f "$UNIVERSAL_APK" "droidulator-${TAG_NAME}.apk" || true
            fi
            for arch in arm64-v8a armeabi-v7a x86_64 x86; do
              SOURCE_APK=$(ls *${arch}*.apk 2>/dev/null | head -n 1 || true)
              if [ -n "$SOURCE_APK" ] && [ -f "$SOURCE_APK" ] && [ "$SOURCE_APK" != "droidulator-${TAG_NAME}-${arch}.apk" ]; then
                mv -f "$SOURCE_APK" "droidulator-${TAG_NAME}-${arch}.apk" || true
              fi
            done
            for apk in *.apk; do
              if [[ "$apk" != "droidulator-${TAG_NAME}"* ]]; then
                rm -f "$apk"
              fi
            done
          else
            BUILD_DATE=$(date -u +'%y.%m.%d')
            # Create nightly-named split APKs for all architectures
            for arch in arm64-v8a armeabi-v7a x86_64 x86 universal; do
              SOURCE_APK=$(ls *${arch}*.apk 2>/dev/null | head -n 1 || true)
              if [ -n "$SOURCE_APK" ] && [ -f "$SOURCE_APK" ]; then
                cp -f "$SOURCE_APK" "droidulator-${BUILD_DATE}-nightly-${arch}.apk" || true
              fi
            done
            UNIVERSAL_APK=$(ls *universal*.apk 2>/dev/null | head -n 1 || true)
            if [ -n "$UNIVERSAL_APK" ] && [ -f "$UNIVERSAL_APK" ]; then
              cp -f "$UNIVERSAL_APK" "droidulator-${BUILD_DATE}-nightly.apk" || true
            fi
            # Remove raw build artifacts without -nightly to keep nightly release clean
            for apk in *.apk; do
              if [[ "$apk" != *"-nightly"* ]]; then
                rm -f "$apk"
              fi
            done
          fi
          ls -la

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/ci/*.apk
          retention-days: 3

      - name: Create GitHub Release (Tag Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: app/build/outputs/apk/ci/*.apk
          generate_release_notes: true
          prerelease: false

      - name: Clean up previous Nightly release
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          sleep 2

      - name: Create Nightly GitHub Release
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body: "Automated nightly build (${{ env.BUILD_DATE }}) from main branch."
          files: app/build/outputs/apk/ci/*.apk
          prerelease: true
          make_latest: false
